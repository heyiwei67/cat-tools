mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  nameserver: [223.5.5.5, 119.29.29.29]
  fallback: [https://doh.pub/dns-query, https://dns.alidns.com/dns-query]
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/8

proxy-providers:
  RIPAO:
    type: http
    url: "https://raw.githubusercontent.com/ripaojiedian/freenode/main/sub"
    interval: 21600
    path: ./providers/ripao.yaml
    health-check: { enable: true, url: https://cp.cloudflare.com/generate_204, interval: 600, lazy: true }
  FREEFQ:
    type: http
    url: "https://raw.githubusercontent.com/freefq/free/master/v2"
    interval: 21600
    path: ./providers/freefq.yaml
    health-check: { enable: true, url: https://cp.cloudflare.com/generate_204, interval: 600, lazy: true }
  ERMAOZI:
    type: http
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt"
    interval: 21600
    path: ./providers/ermaozi.yaml
    filter: "(?i)(香港|台湾|日本|新加坡|韩国|美国|HK|TW|JP|SG|US)"
    health-check: { enable: true, url: https://cp.cloudflare.com/generate_204, interval: 600, lazy: true }
  PEASOFT:
    type: http
    url: "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt"
    interval: 21600
    path: ./providers/peasoft.yaml
    filter: "(?i)(香港|台湾|日本|新加坡|韩国|美国|HK|TW|JP|SG|US)"
    health-check: { enable: true, url: https://cp.cloudflare.com/generate_204, interval: 600, lazy: true }

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP: { ports: [80, 8080-8880] }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }

