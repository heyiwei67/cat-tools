proxy-groups:
  - name: PROXY
    type: url-test
    proxies: ["FX-意大利|@ripaoj", "FX-意大利2|@ripao", "FX-新西兰+V2CROSS", "FX-新西兰+V2C-2", "FX-新西兰+V2C-3"]
    use: [RIPAO, FREEFQ, ERMAOZI, PEASOFT]
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 手动
    type: select
    use: [RIPAO, FREEFQ, ERMAOZI, PEASOFT]

