mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN

proxy-providers:
  RIPAO:
    type: http
    url: "https://raw.githubusercontent.com/ripaojiedian/freenode/main/sub"
    interval: 21600
    path: ./providers/ripao.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
  FREEFQ:
    type: http
    url: "https://raw.githubusercontent.com/freefq/free/master/v2"
    interval: 21600
    path: ./providers/freefq.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true

